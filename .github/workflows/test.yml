name: Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [20, 22, 24, 26]
        include:
          - os: macos-latest
            node-version: 26
          - os: windows-latest
            node-version: 26
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm exec eslint --ext .js,.jsx,.ts,.tsx .
      - name: Compile to check syntax
        run: pnpm run check
      - name: Run tests
        run: pnpm exec jest --verbose --coverage
      - name: Build
        run: pnpm run build:cjs && pnpm run build:esm
